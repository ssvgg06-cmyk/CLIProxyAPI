version: "3.3"

services:
  cpa-demo:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: v7.1.5-demo
        COMMIT: demo-mode
        BUILD_DATE: local
    image: cpa-demo:v7.1.5
    container_name: cpa-demo
    command: ["./CLIProxyAPI", "--config", "/demo/config.yaml", "--local-model"]
    environment:
      CPA_DEMO_MODE: "true"
      MANAGEMENT_PASSWORD: "${CPA_DEMO_PASSWORD}"
    ports:
      - "127.0.0.1:18317:8317"
    networks:
      - cpa-demo-network
    volumes:
      - ./config.yaml:/demo/config.yaml:ro
    tmpfs:
      - /tmp/cpa-demo:mode=700
      - /demo/static:mode=755
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  cpa-demo-network:
    external:
      name: new-api-stack_app
